version: "3.9"

services:
  maumau-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: maumau-web-app
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DB_HOST=mariadb
      - DB_USER=maumau_user
      - DB_PASSWORD=maumau_pass
      - DB_NAME=maumau_db
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped

  maumau-cli:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: maumau-cli-app
    stdin_open: true
    tty: true
    command: ["python3", "-m", "maumau.cli"]

  mariadb:
    image: mariadb:11.2
    container_name: maumau-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: root_secure_password
      MARIADB_DATABASE: maumau_db
      MARIADB_USER: maumau_user
      MARIADB_PASSWORD: maumau_pass
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mariadb_data:
    driver: local
