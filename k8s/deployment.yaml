apiVersion: apps/v1
kind: Deployment
metadata:
  name: maumau-web-deployment
  namespace: default
  labels:
    app: maumau-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: maumau-web
  template:
    metadata:
      labels:
        app: maumau-web
    spec:
      containers:
      - name: maumau-web
        image: maumau-web:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: PORT
          value: "8000"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 3
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: maumau-web-service
  namespace: default
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: maumau-web
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: maumau-web-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: maumau-web-service
            port:
              number: 80
